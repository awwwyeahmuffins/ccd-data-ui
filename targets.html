<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Priority Precincts — Collin County Elections</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230B4DA2'/><text x='16' y='23' font-family='Georgia,serif' font-size='16' font-weight='700' text-anchor='middle' fill='%23FFFFFF'>TX</text></svg>" />
  <meta name="description" content="Targetable precincts ranked by campaign strategy — flips, turnout opportunity, persuasion, registration, and leverage — for any Texas county." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <!-- civic.css loads AFTER styles.css so the a11y layer wins by source order -->
  <link rel="stylesheet" href="js/civic.css" />
  <style>
    /* styles.css pins html/body to the full-viewport map layout; restore flow */
    html, body { display: block; height: auto; width: auto; overflow: auto; }
    body { margin: 0; font-family: var(--font-body); background: var(--color-bg-secondary); color: var(--color-text-primary); font-size: 1rem; }

    /* Header: the shared civic header (js/siteNav.js + js/civic.css) */

    .page-main { max-width: 1180px; margin: 0 auto; padding: 28px 20px 80px; }
    .page-title { font-family: var(--font-display); font-size: 32px; margin: 0 0 6px; }
    .page-sub { color: var(--color-text-secondary); margin: 0 0 24px; max-width: 760px; }

    .controls {
      background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 14px;
      padding: 16px 20px; margin-bottom: 22px; display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-end;
    }
    .controls label { display: block; font-weight: 600; font-size: 0.889rem; margin-bottom: 6px; color: var(--color-text-secondary); }
    .controls select {
      font-size: 1rem; padding: 10px 12px; border-radius: 8px; min-height: 44px;
      border: 1px solid var(--color-border); background: #fff; color: var(--color-text-primary);
    }

    /* ---- "Change strategy" disclosure — one single-level toggle ---- */
    .tg-disclose {
      display: flex; align-items: center; justify-content: space-between; width: 100%;
      min-height: 52px; background: var(--color-bg-primary); border: 1px solid var(--color-border);
      border-radius: 12px; padding: 14px 18px; margin-bottom: 16px;
      font-family: var(--font-body); font-size: 1rem; font-weight: 700; color: var(--color-text-primary);
      cursor: pointer;
    }
    .tg-disclose:hover, .tg-disclose:focus-visible { border-color: var(--color-primary); }
    .tg-current { font-weight: 600; color: var(--color-text-secondary); }
    .tg-disclose-mark { color: var(--color-primary); }
    #tg-catalog-wrap { margin-bottom: 10px; }

    /* ---- strategy catalogue ---- */
    .strat-cat { margin-bottom: 22px; }
    .strat-cat-head { display: flex; align-items: center; gap: 11px; margin: 0 0 12px; }
    .strat-cat-ic {
      width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; flex: none;
      background: var(--color-bg-tertiary); color: var(--color-primary);
    }
    .strat-cat-ic svg { width: 19px; height: 19px; stroke-width: 1.8; }
    .strat-cat-title { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
    .strat-cat-blurb { font-size: 0.889rem; color: var(--color-text-secondary); margin-top: 1px; }
    .strat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
    .strat-card {
      text-align: left; background: var(--color-bg-primary); border: 1.5px solid var(--color-border);
      border-radius: 12px; padding: 13px 15px; cursor: pointer; font-family: var(--font-body);
      transition: border-color .12s, box-shadow .12s, background .12s; color: inherit;
    }
    .strat-card:hover:not(:disabled) { border-color: var(--color-primary); }
    .strat-card.active { border-color: var(--color-primary); background: #eef4fc; box-shadow: 0 0 0 1px var(--color-primary) inset; }
    .strat-card:disabled { opacity: .5; cursor: not-allowed; }
    .strat-card-name { font-weight: 700; font-size: 1rem; margin-bottom: 3px; }
    .strat-card-blurb { font-size: 0.889rem; color: var(--color-text-secondary); line-height: 1.45; }
    .strat-card-na { font-size: 0.889rem; color: var(--color-text-secondary); font-weight: 600; margin-top: 6px; }

    /* ---- results ---- */
    .results-head {
      display: flex; align-items: baseline; justify-content: space-between; gap: 14px; flex-wrap: wrap;
      margin: 30px 0 14px; padding-bottom: 12px; border-bottom: 2px solid var(--color-border);
    }
    .results-title { font-family: var(--font-display); font-size: 24px; font-weight: 700; }
    .results-sub { color: var(--color-text-secondary); font-size: 0.889rem; margin-top: 3px; max-width: 640px; }
    .results-count { font-family: var(--font-body); font-size: 0.889rem; color: var(--color-text-secondary); font-weight: 600; white-space: nowrap; }

    .tg-precinct {
      display: grid; grid-template-columns: 48px 1fr auto; gap: 16px; align-items: center;
      background: var(--color-bg-primary); border: 1px solid var(--color-border); border-radius: 12px;
      padding: 14px 18px; margin-bottom: 10px;
    }
    .tg-rank { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--color-primary); text-align: center; }
    .tg-pcode { font-weight: 700; font-size: 1rem; margin-bottom: 7px; }
    .tg-why { font-size: 1rem; color: var(--color-text-secondary); margin-top: 7px; line-height: 1.45; }
    .tg-why b { color: var(--color-text-primary); font-variant-numeric: tabular-nums; }

    /* thin stacked mark; the values live in the "why" text, never inside paint */
    .tg-leanbar { height: 12px; border-radius: 4px; display: flex; gap: 2px; max-width: 360px; }
    .tg-leanbar span { min-width: 0; border-radius: 3px; }
    .tg-seg-rep { background: var(--color-rep); }
    .tg-seg-mod { background: var(--color-mod); }
    .tg-seg-dem { background: var(--color-dem); }

    .tg-pmeta { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .tg-metric-val { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
    .tg-metric-label { font-size: 0.889rem; color: var(--color-text-secondary); font-weight: 600; }
    .tg-links { display: flex; gap: 8px; margin-top: 2px; }
    .tg-links a {
      text-decoration: none; font-weight: 600; font-size: 1rem; padding: 8px 14px; border-radius: 8px;
      min-height: 44px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    }
    .tg-link-report { background: var(--color-primary); color: #fff; }
    .tg-link-map { border: 1.5px solid var(--color-border); color: var(--color-text-secondary); background: #fff; }
    .tg-link-map:hover { border-color: var(--color-primary); color: var(--color-primary); }

    .empty-note { color: var(--color-text-muted); padding: 28px 4px; }
    .na-banner {
      background: #fff8e1; border: 1px solid #b8973a; border-radius: 10px; padding: 12px 16px;
      font-size: 1rem; color: #5c4a0d; margin-bottom: 16px;
    }

    @media (max-width: 680px) {
      .tg-precinct { grid-template-columns: 36px 1fr; }
      .tg-pmeta { grid-column: 2; align-items: flex-start; text-align: left; }
      .tg-links { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header id="site-header"></header>

  <main class="page-main">
    <h1 class="page-title">Priority precincts</h1>
    <p class="page-sub">The precincts most worth your time, ranked. We start with the closest races — change the strategy any time. Every number comes from the precinct's real modeled-vote, turnout, and demographic data.</p>

    <div class="controls">
      <div>
        <label for="tg-county">County or district</label>
        <select id="tg-county" aria-label="County or district"></select>
      </div>
      <div>
        <label for="tg-election">Score on</label>
        <select id="tg-election" aria-label="Election to score precincts on">
          <option value="">Overall partisan lean</option>
        </select>
      </div>
      <div>
        <label for="tg-limit">Show top</label>
        <select id="tg-limit" aria-label="Number of precincts">
          <option value="15">15 precincts</option>
          <option value="25" selected>25 precincts</option>
          <option value="50">50 precincts</option>
          <option value="100">100 precincts</option>
        </select>
      </div>
    </div>

    <button type="button" class="tg-disclose" id="tg-strategy-btn" aria-expanded="false" aria-controls="tg-catalog-wrap">
      <span>Change strategy <span class="tg-current" id="tg-strategy-current"></span></span>
      <span class="tg-disclose-mark" aria-hidden="true">▾</span>
    </button>
    <div id="tg-catalog-wrap" hidden>
      <div id="tg-catalog"></div>
    </div>

    <div class="results-head">
      <div>
        <div class="results-title" id="tg-results-title">Closest Races</div>
        <div class="results-sub" id="tg-results-sub"></div>
      </div>
      <div class="results-count" id="tg-results-count"></div>
    </div>
    <div id="tg-na"></div>
    <div id="tg-list"><div class="empty-note">Loading…</div></div>
  </main>

  <script src="js/vendor/d3.v7.min.js"></script>
  <script type="module" src="js/targetsPage.js"></script>
  <script type="module" src="js/siteNav.js"></script>
</body>
</html>
