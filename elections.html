<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elections — Texas Elections</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23F5B312'/><text x='16' y='23' font-family='Georgia,serif' font-size='16' font-weight='700' text-anchor='middle' fill='%232A1D02'>TX</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* styles.css pins html/body to a flex full-viewport layout for the map
       app (overflow hidden, no document scroll) — restore normal page flow */
    html, body {
      display: block;
      height: auto;
      width: auto;
      overflow: auto;
    }
    body {
      margin: 0;
      font-family: var(--font-body);
      background: var(--color-bg-secondary);
      color: var(--color-text-primary);
      font-size: 17px;
    }
    .page-header {
      background: var(--color-bg-primary);
      border-bottom: 1px solid var(--color-border);
      padding: 14px 24px;
      display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
    .brand-icon {
      background: linear-gradient(150deg, #F5B312, #C68A0C); color: #2A1D02; font-weight: 800;
      border-radius: 10px; width: 34px; height: 34px; display: grid; place-items: center; font-size: 15px;
      letter-spacing: -.5px;
    }
    .brand-text { font-family: var(--font-display); font-weight: 700; font-size: 20px; }
    .site-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
    .site-nav a {
      display: inline-flex; align-items: center; gap: 7px;
      text-decoration: none; color: var(--color-text-secondary);
      padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 15px;
    }
    .site-nav a svg { width: 16px; height: 16px; stroke-width: 1.8; }
    .site-nav a:hover { background: var(--color-bg-tertiary); }
    .site-nav a.active { background: var(--color-primary); color: #fff; }

    .page-main { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }
    .page-title { font-family: var(--font-display); font-size: 32px; margin: 0 0 6px; }
    .page-sub { color: var(--color-text-secondary); margin: 0 0 24px; }

    .controls {
      background: var(--color-bg-primary); border: 1px solid var(--color-border);
      border-radius: 14px; padding: 18px 20px; margin-bottom: 20px;
      display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end;
    }
    .controls label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: var(--color-text-secondary); }
    .controls select, .controls input[type=search] {
      font-size: 16px; padding: 10px 12px; border-radius: 8px; min-height: 44px;
      border: 1px solid var(--color-border); background: #fff;
    }
    .controls .grow { flex: 1 1 240px; min-width: 0; }
    .controls .grow input { width: 100%; box-sizing: border-box; }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .chip {
      border: 1.5px solid var(--color-border); background: #fff; border-radius: 999px;
      padding: 8px 16px; cursor: pointer; font-size: 15px; font-weight: 600; min-height: 40px;
      font-family: var(--font-body); color: var(--color-text-secondary);
    }
    .chip.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

    .family-group {
      background: var(--color-bg-primary); border: 1px solid var(--color-border);
      border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    }
    .family-header {
      width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      font-family: var(--font-display); font-size: 19px; padding: 16px 20px;
      display: flex; justify-content: space-between; align-items: center; color: inherit;
    }
    .family-header:hover { background: var(--color-bg-tertiary); }
    .family-count { font-family: var(--font-body); font-size: 14px; color: var(--color-text-muted); font-weight: 600; }
    .family-body { border-top: 1px solid var(--color-border-light); }
    .race-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 20px;
      border-top: 1px solid var(--color-border-light); flex-wrap: wrap;
    }
    .race-row:first-child { border-top: none; }
    .year-heading {
      padding: 10px 20px 4px; font-weight: 700; font-size: 14px;
      color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .05em;
      border-top: 1px solid var(--color-border-light);
    }
    .race-name { flex: 1 1 320px; font-size: 16px; }
    .race-year { color: var(--color-text-muted); font-size: 14px; font-weight: 600; }
    .race-actions { display: flex; gap: 8px; }
    .race-actions a {
      text-decoration: none; font-weight: 600; font-size: 14px; padding: 8px 14px;
      border-radius: 8px; min-height: 36px; display: inline-flex; align-items: center;
    }
    .act-map { background: var(--color-primary); color: #fff; }
    .act-forecast { border: 1.5px solid var(--color-border); color: var(--color-text-secondary); background: #fff; }
    .act-forecast:hover { border-color: var(--color-primary); color: var(--color-primary); }
    .empty-note { color: var(--color-text-muted); padding: 24px 4px; }
    .result-count { color: var(--color-text-muted); font-size: 14px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header class="page-header">
    <a class="brand" href="index.html">
      <span class="brand-icon">TX</span>
      <span class="brand-text">Texas Elections</span>
    </a>
    <nav class="site-nav" aria-label="Site">
      <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20 3 7"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/></svg>Map</a>
      <a href="elections.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>Elections</a>
      <a href="forecast.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>Forecast</a>
      <a href="precinct.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>Lookup</a>
    </nav>
  </header>

  <main class="page-main">
    <h1 class="page-title">Browse elections</h1>
    <p class="page-sub">Every race on file for the selected county or district. Open any race on the map, or forecast a turnout scenario for it.</p>

    <div class="controls">
      <div>
        <label for="el-county">County or district</label>
        <select id="el-county" aria-label="County or district"></select>
      </div>
      <div class="grow">
        <label for="el-search">Search races</label>
        <input type="search" id="el-search" placeholder="governor, president, school board…" aria-label="Search races" />
      </div>
    </div>

    <div class="chips" id="el-chips" role="group" aria-label="Filter by category"></div>
    <div class="result-count" id="el-count" role="status"></div>
    <div id="el-list"><div class="empty-note">Loading…</div></div>
  </main>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/electionsPage.js"></script>
</body>
</html>
