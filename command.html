<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Precinct Command — Texas Elections</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       PRECINCT COMMAND — a campaign war-room / mission-control UI.
       Deliberately the opposite of the warm-paper map page: dark,
       framed, data-forward. Self-contained (no styles.css).
       ============================================================ */
    :root {
      --bg:        #0a0e14;   /* deep space navy-black */
      --bg-panel:  #0f141d;   /* panel fill */
      --bg-raise:  #161d28;   /* raised cards */
      --bg-inset:  #070a0f;   /* map well */
      --line:      #1f2937;   /* hairlines */
      --line-soft: #161e2a;
      --ink:       #e8edf4;   /* primary text */
      --ink-dim:   #8a97a8;   /* secondary text */
      --ink-faint: #54616f;   /* tertiary / labels */
      --gold:      #F5B312;   /* command accent */
      --gold-dim:  #9a7415;
      --rep:       #E81B23;
      --dem:       #00AEF3;
      --glow-gold: 0 0 0 1px rgba(245,179,18,.5), 0 0 22px rgba(245,179,18,.22);
      --r:         10px;
      --mono:      'IBM Plex Mono', ui-monospace, monospace;
      --display:   'Bricolage Grotesque', system-ui, sans-serif;
      --body:      'Hanken Grotesk', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 15px;
      line-height: 1.45;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: rgba(245,179,18,.3); }

    /* ---- App shell grid ---- */
    .cc-app {
      display: grid;
      grid-template-columns: 76px 1fr 380px;
      grid-template-rows: 58px 1fr;
      grid-template-areas:
        "rail topbar topbar"
        "rail stage  dock";
      height: 100vh;
      width: 100vw;
    }

    /* ===========================================================
       LEFT COMMAND RAIL
       =========================================================== */
    .cc-rail {
      grid-area: rail;
      background: var(--bg-panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 0;
      gap: 6px;
      z-index: 30;
    }
    .cc-brand {
      width: 42px; height: 42px;
      border-radius: 11px;
      background: radial-gradient(circle at 35% 30%, #2a3342, #11161f);
      border: 1px solid var(--line);
      display: grid; place-items: center;
      font-family: var(--display);
      font-weight: 800; font-size: 19px;
      color: var(--gold);
      box-shadow: inset 0 0 12px rgba(245,179,18,.12);
      margin-bottom: 12px;
      letter-spacing: -1px;
    }
    .cc-rail-spacer { flex: 1; }
    .cc-rail-btn {
      width: 48px; height: 48px;
      border-radius: 12px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-faint);
      display: grid; place-items: center;
      cursor: pointer;
      transition: all .15s ease;
      position: relative;
    }
    .cc-rail-btn svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .cc-rail-btn:hover { color: var(--ink); background: var(--bg-raise); }
    .cc-rail-btn.active {
      color: var(--gold);
      background: var(--bg-raise);
      border-color: var(--line);
    }
    .cc-rail-btn.active::before {
      content: ''; position: absolute; left: -14px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 22px; border-radius: 0 3px 3px 0;
      background: var(--gold);
      box-shadow: 0 0 10px var(--gold);
    }
    .cc-rail-btn .cc-tip {
      position: absolute; left: 58px; top: 50%; transform: translateY(-50%);
      background: #000; color: var(--ink);
      border: 1px solid var(--line);
      padding: 5px 9px; border-radius: 7px;
      font-size: 12px; white-space: nowrap;
      font-family: var(--mono);
      opacity: 0; pointer-events: none; transition: opacity .12s;
      z-index: 50;
    }
    .cc-rail-btn:hover .cc-tip { opacity: 1; }

    /* ===========================================================
       TOP CONTEXT BAR
       =========================================================== */
    .cc-topbar {
      grid-area: topbar;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 20px;
      z-index: 20;
    }
    .cc-title {
      font-family: var(--display);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -.4px;
      color: var(--ink);
      white-space: nowrap;
    }
    .cc-title b { color: var(--gold); }
    .cc-county-select {
      position: relative;
    }
    .cc-county-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .cc-county-btn:hover { border-color: var(--gold-dim); }
    .cc-county-btn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }
    .cc-county-menu {
      position: absolute; top: calc(100% + 6px); left: 0;
      width: 280px; max-height: 50vh; overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 6px;
      display: none;
      z-index: 60;
      box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    .cc-county-menu.open { display: block; }
    .cc-county-search {
      width: 100%; background: var(--bg-inset);
      border: 1px solid var(--line); color: var(--ink);
      padding: 8px 10px; border-radius: 7px; font-family: var(--mono);
      font-size: 13px; margin-bottom: 6px;
    }
    .cc-county-search:focus { outline: none; border-color: var(--gold-dim); }
    .cc-county-opt {
      padding: 7px 10px; border-radius: 6px; cursor: pointer;
      font-size: 14px; color: var(--ink-dim);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cc-county-opt:hover { background: var(--bg-raise); color: var(--ink); }
    .cc-county-opt.active { color: var(--gold); }
    .cc-county-opt small { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

    .cc-topbar-spacer { flex: 1; }

    .cc-search-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      height: 38px;
      width: 230px;
      transition: border-color .15s, box-shadow .15s;
    }
    .cc-search-pill:focus-within { border-color: var(--gold-dim); box-shadow: 0 0 0 3px rgba(245,179,18,.08); }
    .cc-search-pill svg { width: 16px; height: 16px; color: var(--ink-faint); flex: none; }
    .cc-search-pill input {
      background: none; border: none; color: var(--ink);
      font-family: var(--mono); font-size: 13px; width: 100%;
    }
    .cc-search-pill input:focus { outline: none; }
    .cc-search-pill input::placeholder { color: var(--ink-faint); }

    .cc-live {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 1.5px; color: var(--ink-dim);
      text-transform: uppercase;
    }
    .cc-live .pulse {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2ECC71; box-shadow: 0 0 0 0 rgba(46,204,113,.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(46,204,113,.6); }
      70% { box-shadow: 0 0 0 7px rgba(46,204,113,0); }
      100% { box-shadow: 0 0 0 0 rgba(46,204,113,0); }
    }

    /* ===========================================================
       MAP STAGE
       =========================================================== */
    .cc-stage {
      grid-area: stage;
      position: relative;
      background: var(--bg-inset);
      overflow: hidden;
    }
    /* faint tactical grid behind the map */
    .cc-stage::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 1;
    }
    /* vignette */
    .cc-stage::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2;
      box-shadow: inset 0 0 160px rgba(0,0,0,.7);
    }
    #cc-map {
      position: absolute; inset: 0;
      background: var(--bg-inset);
      z-index: 3;
    }
    .leaflet-container { background: var(--bg-inset); outline: none; font-family: var(--mono); }
    .leaflet-control-zoom { border: none !important; margin: 16px !important; }
    .leaflet-control-zoom a {
      background: var(--bg-raise) !important; color: var(--ink) !important;
      border: 1px solid var(--line) !important; width: 32px !important; height: 32px !important;
      line-height: 30px !important; font-size: 17px !important;
    }
    .leaflet-control-zoom a:hover { background: var(--bg-panel) !important; color: var(--gold) !important; }
    .leaflet-control-attribution { display: none; }

    /* mode switch — floating over the map, top-left */
    .cc-modes {
      position: absolute; top: 16px; left: 16px; z-index: 12;
      display: flex; background: rgba(15,20,29,.86);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 4px; gap: 3px;
    }
    .cc-mode-btn {
      font-family: var(--mono); font-size: 11.5px; letter-spacing: .8px;
      text-transform: uppercase; font-weight: 500;
      color: var(--ink-dim); background: none; border: none;
      padding: 8px 14px; border-radius: 7px; cursor: pointer;
      transition: all .14s;
    }
    .cc-mode-btn:hover { color: var(--ink); }
    .cc-mode-btn.active { background: var(--gold); color: #1a1205; font-weight: 600; }

    /* legend — floating bottom-left */
    .cc-legend {
      position: absolute; bottom: 16px; left: 16px; z-index: 12;
      background: rgba(15,20,29,.86); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 10px;
      padding: 12px 14px; min-width: 190px;
    }
    .cc-legend-title {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.4px;
      text-transform: uppercase; color: var(--ink-faint); margin-bottom: 9px;
    }
    .cc-legend-row { display: flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--ink-dim); padding: 2px 0; }
    .cc-legend-sw { width: 14px; height: 14px; border-radius: 4px; flex: none; }
    .cc-legend-ramp { height: 10px; border-radius: 5px; margin: 4px 0 6px; }
    .cc-legend-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }

    /* stage loading state */
    .cc-stage-loading {
      position: absolute; inset: 0; z-index: 14;
      display: grid; place-items: center;
      background: var(--bg-inset);
      font-family: var(--mono); color: var(--ink-dim); font-size: 13px;
      letter-spacing: 1px;
    }
    .cc-stage-loading .spin {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid var(--line); border-top-color: var(--gold);
      animation: spin .8s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cc-stage-loading.hidden { display: none; }

    /* ===========================================================
       RIGHT DATA DOCK
       =========================================================== */
    .cc-dock {
      grid-area: dock;
      background: var(--bg-panel);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cc-dock-head {
      padding: 16px 20px 14px;
      border-bottom: 1px solid var(--line);
    }
    .cc-dock-eyebrow {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--gold); margin-bottom: 5px;
    }
    .cc-dock-title {
      font-family: var(--display); font-weight: 700; font-size: 21px;
      letter-spacing: -.4px; color: var(--ink);
    }
    .cc-dock-sub { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); margin-top: 3px; }
    .cc-dock-body { flex: 1; overflow-y: auto; padding: 16px 20px 28px; }

    .cc-dock-body::-webkit-scrollbar { width: 8px; }
    .cc-dock-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .cc-county-menu::-webkit-scrollbar { width: 8px; }
    .cc-county-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* stat blocks */
    .cc-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
    .cc-stat {
      background: var(--bg-raise); border: 1px solid var(--line-soft);
      border-radius: var(--r); padding: 12px 14px;
    }
    .cc-stat.wide { grid-column: 1 / -1; }
    .cc-stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
    .cc-stat-value { font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -.5px; color: var(--ink); line-height: 1; }
    .cc-stat-value small { font-size: 14px; color: var(--ink-dim); font-weight: 500; }

    /* lean bar */
    .cc-leanbar { height: 30px; border-radius: 8px; overflow: hidden; display: flex; border: 1px solid var(--line); margin-top: 4px; }
    .cc-leanbar span { display: grid; place-items: center; font-family: var(--mono); font-size: 11px; font-weight: 600; color: #fff; min-width: 0; }
    .cc-leanbar .seg-rep { background: var(--rep); }
    .cc-leanbar .seg-mod { background: #800080; }
    .cc-leanbar .seg-dem { background: var(--dem); }

    .cc-section-label {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.6px;
      text-transform: uppercase; color: var(--ink-faint);
      margin: 22px 0 11px; display: flex; align-items: center; gap: 9px;
    }
    .cc-section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    /* demographic rows */
    .cc-demo-row { margin-bottom: 11px; }
    .cc-demo-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .cc-demo-top .name { color: var(--ink-dim); }
    .cc-demo-top .val { font-family: var(--mono); color: var(--ink); }
    .cc-demo-track { height: 7px; background: var(--bg-inset); border-radius: 4px; overflow: hidden; }
    .cc-demo-fill { height: 100%; border-radius: 4px; }

    /* empty / hint dock state */
    .cc-dock-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; text-align: center; color: var(--ink-faint); padding: 40px 24px;
    }
    .cc-dock-empty svg { width: 46px; height: 46px; margin-bottom: 16px; stroke-width: 1.3; opacity: .5; }
    .cc-dock-empty h3 { font-family: var(--display); font-weight: 700; font-size: 18px; color: var(--ink-dim); margin-bottom: 8px; }
    .cc-dock-empty p { font-size: 13.5px; max-width: 240px; line-height: 1.5; }

    .cc-pill-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 4px; }
    .cc-pill {
      font-family: var(--mono); font-size: 11px; letter-spacing: .5px;
      padding: 5px 10px; border-radius: 20px;
      border: 1px solid var(--line); color: var(--ink-dim);
      background: var(--bg-raise);
    }
    .cc-pill.rep { color: #ff8d92; border-color: rgba(232,27,35,.35); }
    .cc-pill.dem { color: #79d4ff; border-color: rgba(0,174,243,.35); }
    .cc-pill.gold { color: var(--gold); border-color: var(--gold-dim); }

    .cc-deeplink {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; text-decoration: none;
      background: var(--bg-raise); border: 1px solid var(--line);
      border-radius: 9px; padding: 12px 14px; margin-top: 9px;
      color: var(--ink); transition: all .15s; cursor: pointer;
    }
    .cc-deeplink:hover { border-color: var(--gold-dim); transform: translateX(2px); }
    .cc-deeplink .dl-l { display: flex; align-items: center; gap: 11px; text-align: left; }
    .cc-deeplink .dl-ic { color: var(--gold); display: grid; place-items: center; }
    .cc-deeplink .dl-ic svg { width: 18px; height: 18px; }
    .cc-deeplink .dl-t { display: block; font-weight: 600; font-size: 14px; }
    .cc-deeplink .dl-s { display: block; font-size: 11.5px; color: var(--ink-faint); font-family: var(--mono); }
    .cc-deeplink .dl-arrow { color: var(--ink-faint); }

    /* tactical map tooltip */
    .cc-tip-map {
      background: rgba(7,10,15,.94) !important; backdrop-filter: blur(8px);
      border: 1px solid var(--line) !important; border-radius: 8px !important;
      color: var(--ink) !important; font-family: var(--mono) !important;
      font-size: 12px !important; padding: 8px 11px !important;
      box-shadow: 0 8px 24px rgba(0,0,0,.6) !important;
    }
    .cc-tip-map::before { display: none !important; }
    .cc-tip-map b { color: var(--gold); }

    /* ===========================================================
       RESPONSIVE — collapse dock, then rail, on smaller screens
       =========================================================== */
    @media (max-width: 1100px) {
      .cc-app { grid-template-columns: 76px 1fr; grid-template-areas: "rail topbar" "rail stage"; }
      .cc-dock {
        position: fixed; top: 58px; right: 0; bottom: 0; width: min(380px, 88vw);
        transform: translateX(100%); transition: transform .25s ease; z-index: 40;
        box-shadow: -20px 0 50px rgba(0,0,0,.5);
      }
      .cc-dock.open { transform: translateX(0); }
    }
    @media (max-width: 680px) {
      .cc-app { grid-template-columns: 1fr; grid-template-rows: 58px 1fr; grid-template-areas: "topbar" "stage"; }
      .cc-rail {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto;
        flex-direction: row; width: 100%; height: 60px; padding: 0 10px;
        border-right: none; border-top: 1px solid var(--line); z-index: 45;
        justify-content: space-around;
      }
      .cc-brand, .cc-rail-spacer { display: none; }
      .cc-rail-btn.active::before { display: none; }
      .cc-title { font-size: 15px; }
      .cc-search-pill { width: 150px; }
      .cc-county-menu { width: 240px; }
    }
  </style>
</head>
<body>
  <div class="cc-app">
    <!-- LEFT COMMAND RAIL -->
    <nav class="cc-rail" aria-label="Command rail">
      <div class="cc-brand">TX</div>

      <button class="cc-rail-btn active" data-rail="map" aria-label="Tactical map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20 3 7"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/></svg>
        <span class="cc-tip">Tactical Map</span>
      </button>
      <a class="cc-rail-btn" href="elections.html" aria-label="Elections catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
        <span class="cc-tip">Elections Catalog</span>
      </a>
      <a class="cc-rail-btn" href="forecast.html" aria-label="Forecast tool">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>
        <span class="cc-tip">Forecast Tool</span>
      </a>
      <a class="cc-rail-btn" href="precinct.html" aria-label="Precinct lookup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <span class="cc-tip">Precinct Lookup &amp; Report</span>
      </a>

      <div class="cc-rail-spacer"></div>

      <a class="cc-rail-btn" href="index.html" aria-label="Classic map view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 0 0 18M12 3a14 14 0 0 1 0 18M3 12h18"/></svg>
        <span class="cc-tip">Classic View</span>
      </a>
    </nav>

    <!-- TOP CONTEXT BAR -->
    <header class="cc-topbar">
      <div class="cc-title">PRECINCT <b>COMMAND</b></div>

      <div class="cc-county-select">
        <button class="cc-county-btn" id="cc-county-btn">
          <span class="dot"></span>
          <span id="cc-county-name">Collin County</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="cc-county-menu" id="cc-county-menu">
          <input type="text" class="cc-county-search" id="cc-county-search" placeholder="Search 254 counties…" />
          <div id="cc-county-list"></div>
        </div>
      </div>

      <div class="cc-topbar-spacer"></div>

      <label class="cc-search-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" id="cc-precinct-search" placeholder="Jump to precinct #" inputmode="numeric" />
      </label>

      <div class="cc-live"><span class="pulse"></span> Live Data</div>
    </header>

    <!-- MAP STAGE -->
    <main class="cc-stage">
      <div class="cc-modes" id="cc-modes">
        <button class="cc-mode-btn active" data-mode="lean">Lean</button>
        <button class="cc-mode-btn" data-mode="margin">Margin</button>
        <button class="cc-mode-btn" data-mode="diversity">Diversity</button>
      </div>

      <div id="cc-map"></div>

      <div class="cc-legend" id="cc-legend"></div>

      <div class="cc-stage-loading" id="cc-loading">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div class="spin"></div>
          <div>ACQUIRING PRECINCT TELEMETRY…</div>
        </div>
      </div>
    </main>

    <!-- RIGHT DATA DOCK -->
    <aside class="cc-dock" id="cc-dock">
      <div class="cc-dock-head">
        <div class="cc-dock-eyebrow" id="cc-dock-eyebrow">County Briefing</div>
        <div class="cc-dock-title" id="cc-dock-title">Collin County</div>
        <div class="cc-dock-sub" id="cc-dock-sub">Loading telemetry…</div>
      </div>
      <div class="cc-dock-body" id="cc-dock-body"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/commandCenter.js"></script>
</body>
</html>
