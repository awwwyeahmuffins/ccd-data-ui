  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       PRECINCT COMMAND — "peanut butter & chocolate."
       CHOCOLATE: the war-room structure (command rail · context
       strip · framed tactical map · live data dock · mono data).
       PEANUT BUTTER: the civic large-print soul (warm paper, ink,
       Fraunces + Public Sans, 17px floor / 44px targets, real
       basemap grounding) for precinct chairs 65+ on iPads.
       Default = warm "Paper Command"; dark = "War Room" toggle.
       Self-contained (no styles.css).
       ============================================================ */

    /* ---- LIGHT "PAPER COMMAND" (default) ---- */
    :root {
      --bg:          #EFEBE2;   /* desk / backdrop */
      --bg-panel:    #FFFDF9;   /* paper panels (rail/topbar/dock) */
      --bg-raise:    #FFFFFF;   /* raised cards */
      --bg-inset:    #E7E2D7;   /* map well */
      --line:        #D8D2C6;   /* hairlines */
      --line-soft:   #E5E0D6;
      --ink:         #1C2733;   /* primary text */
      --ink-dim:     #44505C;   /* secondary text */
      --ink-faint:   #5F6B76;   /* labels (still ≥ AA on paper) */
      --accent:      #9A6F08;   /* deep gold — readable on paper */
      --accent-fill: #F5B312;   /* bright gold — button fills */
      --accent-on:   #2A1D02;   /* text on gold */
      --primary:     #0B4DA2;   /* civic blue — focus/links */
      --rep:         #E81B23;
      --dem:         #00AEF3;
      --mod:         #800080;
      --no-data:     #DAD3C6;   /* unscored precincts */
      --stroke:      #FFFDF9;   /* polygon hairline */
      --glass:       rgba(255,253,249,.94);
      --shadow:      0 1px 3px rgba(28,39,51,.10), 0 8px 24px rgba(28,39,51,.12);
      --shadow-pop:  0 18px 44px rgba(28,39,51,.20);
      --grid-op:     0;         /* tactical grid only in dark */
      --vignette:    rgba(28,39,51,.10);
      --tiles-op:    0.62;
      --tiles-filter:saturate(.82) brightness(1.02);

      --r:        12px;
      --display:  'Fraunces', Georgia, 'Times New Roman', serif;
      --body:     'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --mono:     'IBM Plex Mono', ui-monospace, monospace;
    }

    /* ---- DARK "WAR ROOM" ---- */
    [data-theme="dark"] {
      --bg:          #0a0e14;
      --bg-panel:    #0f141d;
      --bg-raise:    #161d28;
      --bg-inset:    #070a0f;
      --line:        #1f2937;
      --line-soft:   #161e2a;
      --ink:         #e8edf4;
      --ink-dim:     #97a4b5;
      --ink-faint:   #6a7889;
      --accent:      #F5B312;
      --accent-fill: #F5B312;
      --accent-on:   #1a1205;
      --primary:     #7FB1F0;
      --no-data:     #1b2330;
      --stroke:      #0a0e14;
      --glass:       rgba(15,20,29,.88);
      --shadow:      0 0 0 1px rgba(255,255,255,.02), 0 10px 30px rgba(0,0,0,.5);
      --shadow-pop:  0 18px 44px rgba(0,0,0,.6);
      --grid-op:     0.045;
      --vignette:    rgba(0,0,0,.7);
      --tiles-op:    0.55;
      --tiles-filter:none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 17px;                /* large-print floor */
      line-height: 1.5;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease, color .3s ease;
    }
    ::selection { background: rgba(245,179,18,.3); }

    /* ---- App shell grid ---- */
    .cc-app {
      display: grid;
      grid-template-columns: 80px 1fr 400px;
      grid-template-rows: 64px 1fr;
      grid-template-areas:
        "rail topbar topbar"
        "rail stage  dock";
      height: 100vh;
      width: 100vw;
    }

    /* ===========================================================
       LEFT COMMAND RAIL
       =========================================================== */
    .cc-rail {
      grid-area: rail;
      background: var(--bg-panel);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 6px;
      z-index: 30;
    }
    .cc-brand {
      width: 46px; height: 46px;
      border-radius: 13px;
      background: linear-gradient(150deg, #F5B312, #C68A0C);
      display: grid; place-items: center;
      font-family: var(--display);
      font-weight: 700; font-size: 19px;
      color: #2A1D02;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
      letter-spacing: -.5px;
    }
    .cc-rail-spacer { flex: 1; }
    .cc-rail-btn {
      width: 52px; height: 52px;        /* ≥44px target */
      border-radius: 14px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink-faint);
      display: grid; place-items: center;
      cursor: pointer;
      transition: all .15s ease;
      position: relative;
      text-decoration: none;
    }
    .cc-rail-btn svg { width: 23px; height: 23px; stroke-width: 1.8; }
    .cc-rail-btn:hover { color: var(--ink); background: var(--bg-raise); box-shadow: var(--shadow); }
    .cc-rail-btn.active {
      color: var(--accent);
      background: var(--bg-raise);
      border-color: var(--line);
      box-shadow: var(--shadow);
    }
    .cc-rail-btn.active::before {
      content: ''; position: absolute; left: -16px; top: 50%;
      transform: translateY(-50%);
      width: 3px; height: 24px; border-radius: 0 3px 3px 0;
      background: var(--accent-fill);
      box-shadow: 0 0 10px var(--accent-fill);
    }
    .cc-rail-btn .cc-tip {
      position: absolute; left: 62px; top: 50%; transform: translateY(-50%);
      background: var(--ink); color: var(--bg-panel);
      padding: 7px 11px; border-radius: 8px;
      font-size: 13px; white-space: nowrap; font-weight: 600;
      font-family: var(--body);
      opacity: 0; pointer-events: none; transition: opacity .12s;
      z-index: 50; box-shadow: var(--shadow-pop);
    }
    .cc-rail-btn:hover .cc-tip { opacity: 1; }

    /* ===========================================================
       TOP CONTEXT BAR
       =========================================================== */
    .cc-topbar {
      grid-area: topbar;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 0 24px;
      z-index: 20;
    }
    .cc-title {
      font-family: var(--display);
      font-weight: 600;
      font-size: 22px;
      letter-spacing: -.3px;
      color: var(--ink);
      white-space: nowrap;
    }
    .cc-title b { color: var(--accent); font-weight: 700; }

    .cc-county-select { position: relative; }
    .cc-county-btn {
      display: flex; align-items: center; gap: 9px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: var(--body); font-weight: 600;
      font-size: 15px;
      padding: 9px 14px; min-height: 44px;
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }
    .cc-county-btn:hover { border-color: var(--accent); box-shadow: var(--shadow); }
    .cc-county-btn .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-fill); box-shadow: 0 0 8px var(--accent-fill); }
    .cc-county-menu {
      position: absolute; top: calc(100% + 8px); left: 0;
      width: 300px; max-height: 52vh; overflow-y: auto;
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px;
      display: none;
      z-index: 60;
      box-shadow: var(--shadow-pop);
    }
    .cc-county-menu.open { display: block; }
    .cc-county-search {
      width: 100%; background: var(--bg-inset);
      border: 1px solid var(--line); color: var(--ink);
      padding: 11px 12px; border-radius: 9px; font-family: var(--body);
      font-size: 16px; margin-bottom: 6px;
    }
    .cc-county-search:focus { outline: none; border-color: var(--accent); }
    .cc-county-opt {
      padding: 10px 12px; border-radius: 8px; cursor: pointer;
      font-size: 16px; color: var(--ink-dim);
      display: flex; justify-content: space-between; align-items: center;
    }
    .cc-county-opt:hover { background: var(--bg-raise); color: var(--ink); }
    .cc-county-opt.active { color: var(--accent); font-weight: 600; }
    .cc-county-opt small { font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }

    .cc-topbar-spacer { flex: 1; }

    .cc-search-pill {
      display: flex; align-items: center; gap: 9px;
      background: var(--bg-raise);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0 14px;
      height: 44px;
      width: 240px;
      transition: border-color .15s, box-shadow .15s;
    }
    .cc-search-pill:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,179,18,.15); }
    .cc-search-pill svg { width: 17px; height: 17px; color: var(--ink-faint); flex: none; }
    .cc-search-pill input {
      background: none; border: none; color: var(--ink);
      font-family: var(--body); font-size: 16px; width: 100%;
    }
    .cc-search-pill input:focus { outline: none; }
    .cc-search-pill input::placeholder { color: var(--ink-faint); }

    .cc-live {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono); font-size: 11px;
      letter-spacing: 1.4px; color: var(--ink-faint);
      text-transform: uppercase;
    }
    .cc-live .pulse {
      width: 9px; height: 9px; border-radius: 50%;
      background: #28a745; box-shadow: 0 0 0 0 rgba(40,167,69,.7);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(40,167,69,.6); }
      70% { box-shadow: 0 0 0 7px rgba(40,167,69,0); }
      100% { box-shadow: 0 0 0 0 rgba(40,167,69,0); }
    }

    .cc-theme-btn {
      width: 44px; height: 44px; border-radius: 11px;
      border: 1px solid var(--line); background: var(--bg-raise);
      color: var(--ink-dim); cursor: pointer; display: grid; place-items: center;
      transition: all .15s;
    }
    .cc-theme-btn:hover { color: var(--accent); border-color: var(--accent); }
    .cc-theme-btn svg { width: 19px; height: 19px; }
    .cc-theme-btn .moon { display: block; }
    .cc-theme-btn .sun { display: none; }
    [data-theme="dark"] .cc-theme-btn .moon { display: none; }
    [data-theme="dark"] .cc-theme-btn .sun { display: block; }

    /* ===========================================================
       MAP STAGE
       =========================================================== */
    .cc-stage {
      grid-area: stage;
      position: relative;
      background: var(--bg-inset);
      overflow: hidden;
    }
    /* tactical grid — visible in dark only */
    .cc-stage::before {
      content: ''; position: absolute; inset: 0; z-index: 4;
      background-image:
        linear-gradient(rgba(150,170,200,.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(150,170,200,.5) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: var(--grid-op);
      pointer-events: none;
    }
    /* vignette framing */
    .cc-stage::after {
      content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 5;
      box-shadow: inset 0 0 160px var(--vignette);
    }
    #cc-map { position: absolute; inset: 0; background: var(--bg-inset); z-index: 3; }
    .leaflet-container { background: var(--bg-inset); outline: none; font-family: var(--mono); }
    .leaflet-tile-pane { opacity: var(--tiles-op); filter: var(--tiles-filter); }
    .leaflet-control-zoom { border: none !important; margin: 18px !important; box-shadow: var(--shadow) !important; border-radius: 11px !important; overflow: hidden; }
    .leaflet-control-zoom a {
      background: var(--bg-raise) !important; color: var(--ink) !important;
      border: 1px solid var(--line) !important; width: 38px !important; height: 38px !important;
      line-height: 36px !important; font-size: 19px !important;
    }
    .leaflet-control-zoom a:hover { background: var(--bg-panel) !important; color: var(--accent) !important; }
    .leaflet-control-attribution {
      background: var(--glass) !important; color: var(--ink-faint) !important;
      font-family: var(--body) !important; font-size: 10px !important; border-radius: 6px 0 0 0 !important;
    }
    .leaflet-control-attribution a { color: var(--accent) !important; }

    /* mode switch — floating over the map, top-left */
    .cc-modes {
      position: absolute; top: 18px; left: 18px; z-index: 12;
      display: flex; background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 5px; gap: 4px; box-shadow: var(--shadow);
    }
    .cc-mode-btn {
      font-family: var(--body); font-size: 14px; font-weight: 600;
      letter-spacing: .2px;
      color: var(--ink-dim); background: none; border: none;
      padding: 10px 16px; min-height: 44px; border-radius: 9px; cursor: pointer;
      transition: all .14s;
    }
    .cc-mode-btn:hover { color: var(--ink); }
    .cc-mode-btn.active { background: var(--accent-fill); color: var(--accent-on); }

    /* legend — floating bottom-left */
    .cc-legend {
      position: absolute; bottom: 18px; left: 18px; z-index: 12;
      background: var(--glass); backdrop-filter: blur(12px);
      border: 1px solid var(--line); border-radius: 12px;
      padding: 14px 16px; min-width: 200px; box-shadow: var(--shadow);
    }
    .cc-legend-title {
      font-family: var(--mono); font-size: 10px; letter-spacing: 1.3px;
      text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px;
    }
    .cc-legend-row { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-dim); padding: 3px 0; }
    .cc-legend-sw { width: 15px; height: 15px; border-radius: 4px; flex: none; border: 1px solid var(--line-soft); }
    .cc-legend-ramp { height: 11px; border-radius: 6px; margin: 5px 0 7px; }
    .cc-legend-scale { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }

    /* stage loading state */
    .cc-stage-loading {
      position: absolute; inset: 0; z-index: 14;
      display: grid; place-items: center;
      background: var(--bg-inset);
      font-family: var(--mono); color: var(--ink-dim); font-size: 13px;
      letter-spacing: 1px;
    }
    .cc-stage-loading .spin {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--line); border-top-color: var(--accent-fill);
      animation: spin .8s linear infinite; margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cc-stage-loading.hidden { display: none; }

    /* Respect reduced-motion: kill the live pulse, spinner, and transitions */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }

    /* ===========================================================
       RIGHT DATA DOCK
       =========================================================== */
    .cc-dock {
      grid-area: dock;
      background: var(--bg-panel);
      border-left: 1px solid var(--line);
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .cc-dock-head {
      padding: 20px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    .cc-dock-eyebrow {
      font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--accent); margin-bottom: 6px; font-weight: 600;
    }
    .cc-dock-title {
      font-family: var(--display); font-weight: 600; font-size: 27px;
      letter-spacing: -.4px; color: var(--ink); line-height: 1.1;
    }
    .cc-dock-sub { font-family: var(--mono); font-size: 13px; color: var(--ink-faint); margin-top: 5px; }
    .cc-dock-body { flex: 1; overflow-y: auto; padding: 18px 24px 32px; }

    .cc-dock-body::-webkit-scrollbar, .cc-county-menu::-webkit-scrollbar { width: 9px; }
    .cc-dock-body::-webkit-scrollbar-thumb, .cc-county-menu::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }

    /* stat blocks */
    .cc-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-bottom: 20px; }
    .cc-stat {
      background: var(--bg-raise); border: 1px solid var(--line-soft);
      border-radius: var(--r); padding: 14px 16px;
    }
    .cc-stat.wide { grid-column: 1 / -1; }
    .cc-stat-label { font-family: var(--mono); font-size: 10px; letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 7px; font-weight: 500; }
    .cc-stat-value { font-family: var(--display); font-weight: 600; font-size: 29px; letter-spacing: -.5px; color: var(--ink); line-height: 1; font-variant-numeric: tabular-nums; }
    .cc-stat-value small { font-size: 15px; color: var(--ink-dim); font-weight: 500; }

    /* lean bar */
    .cc-leanbar { height: 34px; border-radius: 9px; overflow: hidden; display: flex; border: 1px solid var(--line); margin-top: 5px; }
    .cc-leanbar span { display: grid; place-items: center; font-family: var(--mono); font-size: 12px; font-weight: 600; color: #fff; min-width: 0; }
    .cc-leanbar .seg-rep { background: var(--rep); }
    .cc-leanbar .seg-mod { background: var(--mod); }
    .cc-leanbar .seg-dem { background: var(--dem); }

    .cc-section-label {
      font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px;
      text-transform: uppercase; color: var(--ink-faint);
      margin: 24px 0 13px; display: flex; align-items: center; gap: 10px; font-weight: 500;
    }
    .cc-section-label::after { content: ''; flex: 1; height: 1px; background: var(--line); }

    /* demographic rows */
    .cc-demo-row { margin-bottom: 13px; }
    .cc-demo-top { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 6px; }
    .cc-demo-top .name { color: var(--ink-dim); }
    .cc-demo-top .val { font-family: var(--mono); color: var(--ink); font-weight: 500; }
    .cc-demo-track { height: 9px; background: var(--bg-inset); border-radius: 5px; overflow: hidden; }
    .cc-demo-fill { height: 100%; border-radius: 5px; }

    .cc-pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .cc-pill {
      font-family: var(--mono); font-size: 12px; letter-spacing: .4px; font-weight: 500;
      padding: 7px 12px; border-radius: 22px;
      border: 1px solid var(--line); color: var(--ink-dim);
      background: var(--bg-raise);
    }
    .cc-pill.rep { color: var(--rep); border-color: rgba(232,27,35,.4); }
    .cc-pill.dem { color: #0089c0; border-color: rgba(0,174,243,.45); }
    .cc-pill.gold { color: var(--accent); border-color: var(--accent); }
    [data-theme="dark"] .cc-pill.rep { color: #ff8d92; }
    [data-theme="dark"] .cc-pill.dem { color: #79d4ff; }

    .cc-deeplink {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; text-decoration: none;
      background: var(--bg-raise); border: 1px solid var(--line);
      border-radius: 11px; padding: 14px 16px; margin-top: 10px; min-height: 44px;
      color: var(--ink); transition: all .15s; cursor: pointer; font-family: var(--body);
    }
    .cc-deeplink:hover { border-color: var(--accent); transform: translateX(2px); box-shadow: var(--shadow); }
    .cc-deeplink .dl-l { display: flex; align-items: center; gap: 13px; text-align: left; }
    .cc-deeplink .dl-ic { color: var(--accent); display: grid; place-items: center; }
    .cc-deeplink .dl-ic svg { width: 20px; height: 20px; }
    .cc-deeplink .dl-t { display: block; font-weight: 600; font-size: 16px; }
    .cc-deeplink .dl-s { display: block; font-size: 13px; color: var(--ink-faint); }
    .cc-deeplink .dl-arrow { color: var(--ink-faint); font-size: 18px; }

    /* tactical map tooltip */
    .cc-tip-map {
      background: var(--glass) !important; backdrop-filter: blur(10px);
      border: 1px solid var(--line) !important; border-radius: 9px !important;
      color: var(--ink) !important; font-family: var(--mono) !important;
      font-size: 13px !important; padding: 9px 12px !important;
      box-shadow: var(--shadow-pop) !important;
    }
    .cc-tip-map::before { display: none !important; }
    .cc-tip-map b { color: var(--accent); }

    /* ===========================================================
       RESPONSIVE — collapse dock, then rail
       =========================================================== */
    @media (max-width: 1180px) {
      .cc-app { grid-template-columns: 80px 1fr; grid-template-areas: "rail topbar" "rail stage"; }
      .cc-dock {
        position: fixed; top: 64px; right: 0; bottom: 0; width: min(400px, 90vw);
        transform: translateX(100%); transition: transform .25s ease; z-index: 40;
        box-shadow: var(--shadow-pop);
      }
      .cc-dock.open { transform: translateX(0); }
    }
    @media (max-width: 720px) {
      .cc-app { grid-template-columns: 1fr; grid-template-rows: 64px 1fr; grid-template-areas: "topbar" "stage"; }
      .cc-rail {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto;
        flex-direction: row; width: 100%; height: 64px; padding: 0 10px;
        border-right: none; border-top: 1px solid var(--line); z-index: 45;
        justify-content: space-around;
      }
      .cc-brand, .cc-rail-spacer { display: none; }
      .cc-rail-btn.active::before { display: none; }
      .cc-title { font-size: 18px; }
      .cc-search-pill { width: 150px; }
      .cc-county-menu { width: 250px; }
      .cc-live { display: none; }
    }
  </style>
</head>
<body>
  <div class="cc-app">
    <!-- LEFT COMMAND RAIL -->
    <nav class="cc-rail" aria-label="Command rail">
      <div class="cc-brand">TX</div>

      <button class="cc-rail-btn active" data-rail="map" aria-label="Tactical map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20 3 7"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/></svg>
        <span class="cc-tip">Tactical Map</span>
      </button>
      <a class="cc-rail-btn" href="elections.html" aria-label="Elections catalog">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>
        <span class="cc-tip">Elections Catalog</span>
      </a>
      <a class="cc-rail-btn" href="forecast.html" aria-label="Forecast tool">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>
        <span class="cc-tip">Forecast Tool</span>
      </a>
      <a class="cc-rail-btn" href="targets.html" aria-label="Target precincts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg>
        <span class="cc-tip">Target Precincts</span>
      </a>
      <a class="cc-rail-btn" href="explore.html" aria-label="Explore precincts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/><circle cx="8" cy="6" r="1.6" fill="currentColor"/><circle cx="16" cy="12" r="1.6" fill="currentColor"/><circle cx="11" cy="18" r="1.6" fill="currentColor"/></svg>
        <span class="cc-tip">Explore Precincts</span>
      </a>
      <a class="cc-rail-btn" href="precinct.html" aria-label="Precinct lookup">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <span class="cc-tip">Precinct Lookup &amp; Report</span>
      </a>

      <div class="cc-rail-spacer"></div>

      <button class="cc-rail-btn" id="cc-logout" aria-label="Sign out" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span class="cc-tip">Sign Out</span>
      </button>
    </nav>

    <!-- TOP CONTEXT BAR -->
    <header class="cc-topbar">
      <div class="cc-title">Precinct <b>Command</b></div>

      <div class="cc-county-select">
        <button class="cc-county-btn" id="cc-county-btn">
          <span class="dot"></span>
          <span id="cc-county-name">Collin County</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="cc-county-menu" id="cc-county-menu">
          <input type="text" class="cc-county-search" id="cc-county-search" placeholder="Search 254 counties…" />
          <div id="cc-county-list"></div>
        </div>
      </div>

      <div class="cc-topbar-spacer"></div>

      <label class="cc-search-pill">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input type="text" id="cc-precinct-search" placeholder="Jump to precinct #" inputmode="numeric" />
      </label>

      <div class="cc-live"><span class="pulse"></span> Live Data</div>

      <button class="cc-theme-btn" id="cc-theme-btn" aria-label="Toggle theme" title="Toggle light / dark">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>
      </button>
    </header>

    <!-- MAP STAGE -->
    <main class="cc-stage">
      <div class="cc-modes" id="cc-modes">
        <button class="cc-mode-btn active" data-mode="lean">Lean</button>
        <button class="cc-mode-btn" data-mode="margin">Margin</button>
        <button class="cc-mode-btn" data-mode="diversity">Diversity</button>
      </div>

      <div id="cc-map"></div>

      <div class="cc-legend" id="cc-legend"></div>

      <div class="cc-stage-loading" id="cc-loading">
        <div style="text-align:center">
          <div class="spin"></div>
          <div>Loading precinct data…</div>
        </div>
      </div>
    </main>

    <!-- RIGHT DATA DOCK -->
    <aside class="cc-dock" id="cc-dock">
      <div class="cc-dock-head">
        <div class="cc-dock-eyebrow" id="cc-dock-eyebrow">County Briefing</div>
        <div class="cc-dock-title" id="cc-dock-title">Collin County</div>
        <div class="cc-dock-sub" id="cc-dock-sub">Loading…</div>
      </div>
      <div class="cc-dock-body" id="cc-dock-body"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script type="module" src="js/commandCenter.js"></script>
</body>
</html>
