<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Collin County Map App (Toggle Views)</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- If you use Leaflet, D3, Chart.js, etc., include their CSS here -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
</head>

<body>
  <!-- Skip Link for keyboard navigation - accessible to screen readers and keyboard users -->
  <a href="#main-container" class="skip-link">Skip to main content</a>
  
  <!-- ─────────────────────────────────────────────────────────────── -->
  <!-- HEADER BAR: Demographics / Election Forecast buttons + "Election: 2024" -->
  <!-- ─────────────────────────────────────────────────────────────── -->
  <header id="header-bar" role="banner">
    <!-- Left section: brand + view buttons -->
    <div class="header-left">
      <div class="header-brand">
        <span class="header-logo">CC</span>
        <span class="header-title">Collin County Elections</span>
      </div>

      <nav class="view-buttons" aria-label="View selection">
      <button 
        id="view-dem-btn" 
        class="view-btn press-effect active" 
        aria-pressed="true"
        aria-label="Show Demographics view"
      >Demographics</button>
      <button 
        id="view-elect-btn" 
        class="view-btn press-effect" 
        aria-pressed="false"
        aria-label="Show Election Forecast view"
      >Election Forecast</button>
      <button 
        id="view-turnout-btn" 
        class="view-btn press-effect" 
        aria-pressed="false"
        aria-label="Show Turnout Analysis view"
      >Turnout Analysis</button>
      </nav>
    </div>

    <!-- Spacer pushes content to the right -->
    <div class="spacer"></div>

    <!-- Mobile sidebar toggle button -->
    <button 
      id="sidebar-toggle" 
      class="mobile-toggle"
      aria-label="Toggle sidebar menu"
      aria-expanded="false"
      aria-controls="sidebar"
    >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" width="20" height="20">
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
      <span class="sr-only">Menu</span>
    </button>

    <!-- Header actions: Copy Link -->
    <div class="header-actions">
      <button 
        id="copy-link-btn" 
        class="copy-link-btn"
        aria-label="Copy shareable link to clipboard"
        title="Copy shareable link"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        <span>Share</span>
      </button>
    </div>
  </header>

  <!-- Sidebar overlay for mobile (click to close) -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <!-- ─────────────────────────────────────────────────────────────── -->
  <!-- MAIN CONTENT: Sidebar (left) + Map (right)                    -->
  <!-- ─────────────────────────────────────────────────────────────── -->
  <div id="main-container" role="main">
    <div id="sidebar" role="region" aria-label="Data panel with election statistics and controls">
      <div id="sidebar-content">
        <!-- demographicsView.js will populate this on load -->
      </div>
    </div>

    <div id="map" role="application" aria-label="Interactive precinct map">
      <!-- Leaflet map will be initialized here -->
      
      <!-- Map Legend -->
      <div id="map-legend" class="map-legend" aria-label="Map color legend">
        <h4 class="legend-title">Party Lean</h4>
        <div class="legend-items">
          <div class="legend-item">
            <span class="legend-swatch legend-swatch-rep"></span>
            <span class="legend-label">Republican</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch legend-swatch-dem"></span>
            <span class="legend-label">Democrat</span>
          </div>
          <div class="legend-item">
            <span class="legend-swatch legend-swatch-mod"></span>
            <span class="legend-label">Moderate</span>
          </div>
        </div>
        <p class="legend-note">Color intensity indicates strength</p>
      </div>
    </div>
  </div>

  <!-- ─────────────────────────────────────────────────────────────── -->
  <!-- EXTERNAL LIBRARIES: D3, Leaflet, Chart.js, etc.               -->
  <!-- (Include only what you already had for your Demographics map) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.3.1/dist/chart.umd.min.js"
  ></script>
  <script
    src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"
  ></script>

  <!-- ─────────────────────────────────────────────────────────────── -->
  <!-- APP LOGIC: wires the two view modules and toggles between them  -->
  <script type="module" src="js/app.js"></script>
  
  <!-- Keyboard Shortcuts Modal -->
  <div id="shortcuts-modal" class="modal-overlay" role="dialog" aria-labelledby="shortcuts-title" aria-hidden="true">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="shortcuts-title">Keyboard Shortcuts</h3>
        <button class="modal-close" aria-label="Close shortcuts modal">&times;</button>
      </div>
      <div class="modal-body" id="shortcuts-list">
        <!-- Populated by keyboardShortcuts.js -->
      </div>
      <div class="modal-footer">
        <p class="modal-hint">Press <kbd>?</kbd> anytime to toggle this help</p>
      </div>
    </div>
  </div>
  
  <!-- Toast container for notifications -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
