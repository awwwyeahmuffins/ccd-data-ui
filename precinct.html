<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Precinct Lookup — Texas Elections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    /* =============================================================================
       DESIGN SYSTEM — inherited from index.html
       ============================================================================= */

    :root {
      --primary: #0B4DA2;
      --primary-hover: #093E83;
      --primary-light: #E8F0FB;
      --primary-dark: #08305F;
      --secondary: #00AEF3;
      --accent: #1976D2;
      --dem-color: #00AEF3;
      --rep-color: #E81B23;
      --mod-color: #800080;
      --text-primary: #1C2733;
      --text-secondary: #44505C;
      --text-muted: #5F6B76;
      --bg-primary: #FFFDF9;
      --bg-secondary: #F4F1EA;
      --bg-overlay: rgba(28, 39, 51, 0.4);
      --border: #D8D2C6;
      --shadow-sm: 0 1px 2px rgba(28, 39, 51, 0.08);
      --shadow-md: 0 2px 16px rgba(28, 39, 51, 0.12);
      --shadow-lg: 0 8px 28px rgba(28, 39, 51, 0.16);
      --shadow-xl: 0 16px 48px rgba(28, 39, 51, 0.2);
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 20px;
      --radius-full: 9999px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-fast: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --font-body: 'Public Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    [data-theme="dark"] {
      --primary: #7FB1F0;
      --primary-hover: #9CC4F5;
      --primary-light: #1E2A3D;
      --primary-dark: #B7D4F8;
      --secondary: #00AEF3;
      --accent: #5BA3E6;
      --text-primary: #F2EEE6;
      --text-secondary: #C2BCB0;
      --text-muted: #948E82;
      --bg-primary: #161B22;
      --bg-secondary: #1F2630;
      --bg-overlay: rgba(0, 0, 0, 0.6);
      --border: #353D47;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 2px 16px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 28px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    body {
      font-family: var(--font-body);
      font-size: 17px;
      background: var(--bg-secondary);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
    }

    /* =============================================================================
       HEADER
       ============================================================================= */

    .page-header {
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .header-brand-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(150deg, #F5B312, #C68A0C);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #2A1D02;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -.5px;
    }
    .header-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .header-title span {
      color: var(--primary);
    }
    .header-title #header-county-name {
      color: var(--text-primary); /* county name stays ink; only "Precinct Lookup" is primary */
    }

    .header-spacer { flex: 1; }

    .header-link {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      padding: 10px 16px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 7px; /* the label is split across a span + text node; flex eats the space */
      border-radius: var(--radius-full);
      transition: var(--transition-fast);
      white-space: nowrap;
    }
    .header-link svg { width: 16px; height: 16px; stroke-width: 1.8; }
    .header-link:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }

    .theme-toggle {
      border: none;
      background: transparent;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: var(--radius-full);
      transition: var(--transition-fast);
    }
    .theme-toggle:hover {
      background: var(--bg-secondary);
    }

    /* =============================================================================
       SEARCH SECTION
       ============================================================================= */

    .search-section {
      max-width: 640px;
      margin: 48px auto 32px;
      padding: 0 24px;
      text-align: center;
    }

    .search-heading {
      font-family: var(--font-display);
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .search-subheading {
      font-size: 17px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .boundary-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }

    .boundary-pill {
      padding: 10px 18px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .boundary-pill:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .boundary-pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .search-wrapper {
      position: relative;
      max-width: 400px;
      margin: 0 auto;
    }

    .search-input {
      width: 100%;
      padding: 16px 20px;
      font-size: 18px;
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
      transition: var(--transition-fast);
    }
    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 87, 183, 0.15);
    }
    .search-input::placeholder {
      color: var(--text-muted);
    }

    .location-btn {
      margin-top: 14px;
      padding: 12px 22px;
      min-height: 48px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      font-size: 16px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .location-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .location-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .dropdown-item.address-action {
      color: var(--primary);
      font-weight: 500;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      max-height: 300px;
      overflow-y: auto;
      display: none;
      z-index: 50;
    }
    .search-dropdown.open {
      display: block;
    }

    .dropdown-item {
      padding: 14px 16px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 16px;
      transition: var(--transition-fast);
    }
    .dropdown-item:hover,
    .dropdown-item.selected {
      background: var(--bg-secondary);
    }
    .dropdown-code {
      font-weight: 500;
      color: var(--text-primary);
    }
    .dropdown-party {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }
    .dropdown-party.republican, .dropdown-party.rep {
      background: rgba(232, 27, 35, 0.12);
      color: #E81B23;
    }
    .dropdown-party.democrat, .dropdown-party.dem {
      background: rgba(0, 174, 243, 0.12);
      color: #0088CC;
    }
    .dropdown-party.moderate, .dropdown-party.mod {
      background: rgba(128, 0, 128, 0.12);
      color: #800080;
    }

    /* =============================================================================
       INTRO MESSAGE
       ============================================================================= */

    .intro-message {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      font-size: 17px;
    }
    .intro-message.hidden { display: none; }

    /* =============================================================================
       REPORT CONTAINER
       ============================================================================= */

    .report-container {
      max-width: 960px;
      margin: 0 auto 60px;
      padding: 0 24px;
    }
    .report-container.hidden { display: none; }

    /* Tablet: comfortable measure for iPad reading */
    @media (min-width: 601px) and (max-width: 1024px) {
      .report-container {
        max-width: 760px;
      }
      .summary-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    /* Report Header */
    .report-header {
      margin-bottom: 24px;
    }
    .report-header h1 {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .report-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .boundary-label {
      font-size: 13px;
      color: var(--text-secondary);
      padding: 4px 10px;
      background: var(--bg-secondary);
      border-radius: var(--radius-full);
    }
    .party-lean-badge {
      font-size: 13px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-full);
    }
    .party-lean-badge.republican, .party-lean-badge.rep {
      background: rgba(232, 27, 35, 0.12);
      color: #E81B23;
    }
    .party-lean-badge.democrat, .party-lean-badge.dem {
      background: rgba(0, 174, 243, 0.12);
      color: #0088CC;
    }
    .party-lean-badge.moderate, .party-lean-badge.mod {
      background: rgba(128, 0, 128, 0.12);
      color: #800080;
    }

    /* Export bar */
    .export-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }
    .export-bar.hidden { display: none; }

    .export-btn {
      padding: 10px 18px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .export-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Mini Map */
    .mini-map-container {
      height: 300px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    /* Summary Cards */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .summary-value {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }
    .summary-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Report sections (reused profile styles need these wrappers) */
    .report-section {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
    }
    .report-section:empty { display: none; }

    .report-section-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    /* Census unavailable message */
    .census-unavailable {
      padding: 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      background: var(--primary-light);
      border-radius: var(--radius-md);
    }

    .error-message {
      padding: 20px;
      text-align: center;
      color: #C62828;
      background: #FFF0F0;
      border-radius: var(--radius-md);
      border: 1px solid #FFCDD2;
    }

    .empty-state {
      color: var(--text-muted);
      text-align: center;
      padding: 24px;
      font-size: 14px;
    }

    .loading-spinner {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* =============================================================================
       PROFILE CONTENT STYLES (from index.html — needed for generateProfileHTML)
       ============================================================================= */

    .precinct-profile { }
    .profile-header { margin-bottom: 20px; }
    .profile-header h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .profile-pop {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .profile-section {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .profile-section:last-child {
      border-bottom: none;
    }
    .profile-section-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }
    .profile-stats-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .profile-stat {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .profile-stat-value {
      display: block;
      font-size: 20px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
    }
    .profile-stat-label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .profile-bar {
      display: flex;
      height: 20px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .profile-bar-segment {
      min-width: 2px;
      transition: width 0.3s;
    }
    .profile-bar-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--text-secondary);
    }
    .legend-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
    }
    .profile-bars-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .profile-bar-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .bar-label {
      width: 140px;
      flex-shrink: 0;
      color: var(--text-secondary);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      flex: 1;
      height: 14px;
      background: var(--bg-secondary);
      border-radius: 7px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 7px;
      transition: width 0.3s;
    }
    .bar-value {
      width: 40px;
      flex-shrink: 0;
      font-weight: 500;
      color: var(--text-primary);
    }
    .profile-officials-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .official-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      font-size: 15px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-size: 13px;
    }
    .official-label { color: var(--text-secondary); font-weight: 500; }
    .official-value { color: var(--text-primary); text-align: right; }
    .profile-takeaways {
      background: var(--primary-light);
      border-radius: var(--radius-md);
      padding: 16px !important;
      margin-bottom: 20px;
    }
    .takeaway-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .takeaway-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-primary);
    }
    .takeaway-icon { font-size: 16px; flex-shrink: 0; }
    .profile-party-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
      margin-top: 8px;
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .profile-election-result {
      margin-top: 8px;
      padding: 8px 12px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    /* =============================================================================
       ELECTION HISTORY
       ============================================================================= */

    .party-record-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .pr-item {
      font-size: 14px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: var(--radius-full);
    }
    .pr-item.rep { background: rgba(232, 27, 35, 0.1); color: #E81B23; }
    .pr-item.dem { background: rgba(0, 174, 243, 0.1); color: #0088CC; }
    .pr-item.other { background: var(--bg-secondary); color: var(--text-secondary); }

    .history-group {
      margin-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
    }
    .history-group-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-secondary);
      border: none;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .history-group-header:hover {
      background: var(--border);
    }
    .history-group-header .chevron {
      font-size: 10px;
      transition: transform 0.2s;
    }
    .race-count {
      font-weight: 400;
      color: var(--text-muted);
    }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .history-table thead {
      background: var(--bg-secondary);
    }
    .history-table th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    .history-table td {
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      color: var(--text-primary);
    }
    .history-table tr.rep td:nth-child(3) { color: #E81B23; font-weight: 600; }
    .history-table tr.dem td:nth-child(3) { color: #00AEF3; font-weight: 600; }

    /* =============================================================================
       PRINT STYLES
       ============================================================================= */

    @media print {
      .page-header,
      .search-section,
      .export-bar,
      .theme-toggle,
      .header-link {
        display: none !important;
      }

      body {
        background: white !important;
        color: #222 !important;
      }

      .report-container {
        max-width: none;
        padding: 0;
        margin: 0;
      }

      .report-section {
        break-inside: avoid;
        border: 1px solid #ddd;
        box-shadow: none;
      }

      .mini-map-container {
        height: 200px;
      }

      .history-group-body {
        display: block !important;
      }

      :root {
        --text-primary: #222;
        --text-secondary: #555;
        --bg-primary: #fff;
        --bg-secondary: #f5f5f5;
        --border: #ddd;
      }
    }

    /* =============================================================================
       RESPONSIVE
       ============================================================================= */

    @media (max-width: 768px) {
      .search-heading { font-size: 26px; }
      .search-section { margin-top: 32px; }

      .summary-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .report-header h1 { font-size: 24px; }

      .page-header {
        padding: 10px 16px;
        gap: 10px;
      }
      .header-title { font-size: 16px; }

      .back-text { display: none; }
      .header-link { padding: 10px 12px; font-size: 14px; }

      .report-container {
        padding: 0 16px;
      }

      .report-section {
        padding: 16px;
      }

      .takeaway-grid {
        grid-template-columns: 1fr;
      }

      .bar-label {
        width: 100px;
        font-size: 13px;
      }

      .history-table {
        font-size: 14px;
      }
      .history-table th,
      .history-table td {
        padding: 6px 8px;
      }

      .official-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      .official-value { text-align: left; }
    }

    /* =============================================================================
       FIELD ONE-PAGER
       ============================================================================= */
    .field-one-pager {
      max-width: 700px; margin: 0 auto; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: white; border: 1px solid var(--border); border-radius: var(--radius-md);
    }
    .one-pager-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px; padding-bottom: 12px;
      border-bottom: 2px solid var(--text-primary);
    }
    .one-pager-header .precinct-code { font-size: 28px; font-weight: 800; }
    .one-pager-header .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
    .header-badge {
      font-size: 12px; padding: 3px 8px; border-radius: var(--radius-sm);
      background: var(--bg-secondary);
    }
    .party-badge-republican, .party-badge-rep {
      background: rgba(232, 27, 35, 0.12); color: #E81B23;
    }
    .party-badge-democrat, .party-badge-dem {
      background: rgba(0, 174, 243, 0.12); color: #0088CC;
    }
    .party-badge-moderate, .party-badge-mod {
      background: rgba(128, 0, 128, 0.12); color: #800080;
    }
    .trend-badge-dem { color: #0088CC; }
    .trend-badge-rep { color: #E81B23; }
    .one-pager-stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 20px;
    }
    .one-pager-stat {
      text-align: center; padding: 12px 8px;
      background: var(--bg-secondary); border-radius: var(--radius-sm);
    }
    .one-pager-stat .stat-value { font-size: 20px; font-weight: 700; }
    .one-pager-stat .stat-label { font-size: 11px; color: var(--text-secondary); }
    .one-pager-bar {
      margin-bottom: 16px;
    }
    .one-pager-bar-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    .one-pager-bar-container {
      height: 24px; border-radius: var(--radius-sm);
      overflow: hidden; display: flex; width: 100%;
    }
    .one-pager-bar-segment {
      height: 100%; display: flex; align-items: center;
      justify-content: center; font-size: 10px; font-weight: 600;
      color: white; min-width: 20px;
    }
    .one-pager-elections {
      width: 100%; border-collapse: collapse;
      margin-bottom: 16px; font-size: 13px;
    }
    .one-pager-elections th {
      text-align: left; padding: 6px 8px;
      border-bottom: 2px solid var(--text-primary);
      font-size: 11px; text-transform: uppercase;
    }
    .one-pager-elections td {
      padding: 6px 8px; border-bottom: 1px solid var(--border);
    }
    .one-pager-districts {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 16px;
    }
    .one-pager-district {
      padding: 8px; background: var(--bg-secondary);
      border-radius: var(--radius-sm); font-size: 12px;
    }
    .one-pager-district .district-type { font-weight: 600; font-size: 11px; color: var(--text-secondary); }
    .one-pager-district .district-value { font-size: 14px; font-weight: 600; }
    .one-pager-footer {
      text-align: center; font-size: 11px;
      color: var(--text-muted); padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .one-pager-actions {
      display: flex; gap: 8px; justify-content: center;
      margin-top: 16px;
    }
    .one-pager-actions button {
      padding: 8px 16px; border-radius: var(--radius-sm);
      font-size: 13px; cursor: pointer; border: 1px solid var(--border);
      background: var(--bg-primary);
    }
    .one-pager-actions .print-btn { background: var(--primary); color: white; border-color: var(--primary); }
    .one-pager-actions .print-btn:hover { background: var(--primary-hover); }
    .one-pager-actions .copy-btn:hover { background: var(--primary-light); }

    @media print {
      .field-one-pager { border: none; box-shadow: none; max-width: 100%; }
      .one-pager-actions { display: none !important; }
      .one-pager-header { border-bottom-color: black; }
    }
    /* =============================================================================
       HERO DASHBOARD
       ============================================================================= */

    .hero-section { margin-bottom: 24px; }
    .hero-row-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .hero-precinct-code {
      font-family: var(--font-display);
      font-size: 34px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .hero-badges {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .hero-stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .new-precinct-notice {
      margin-top: 12px;
      padding: 12px 16px;
      background: #FFF3CD;
      color: #664D03;
      border: 1px solid #FFECB5;
      border-radius: var(--radius-md);
      font-size: 15px;
      line-height: 1.4;
    }
    [data-theme="dark"] .new-precinct-notice {
      background: #3D3420;
      color: #F0DFA8;
      border-color: #5C4F2E;
    }
    .hero-stat-card {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .hero-stat-value {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .hero-stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .hero-stat-comparison {
      font-size: 11px;
      margin-top: 4px;
      font-weight: 500;
    }
    .hero-stat-comparison.above { color: #4CAF50; }
    .hero-stat-comparison.below { color: #F44336; }
    .hero-stat-comparison.near { color: var(--text-muted); }
    .hero-stat-rank {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* =============================================================================
       SECTION NAVIGATION
       ============================================================================= */

    .section-nav {
      position: sticky;
      top: 57px;
      z-index: 90;
      background: var(--bg-primary);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      box-shadow: var(--shadow-sm);
    }
    .section-nav.hidden { display: none; }
    .section-nav-inner {
      display: flex;
      gap: 4px;
      max-width: 960px;
      margin: 0 auto;
      padding: 8px 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .section-nav-inner::-webkit-scrollbar { display: none; }
    .section-nav-pill {
      padding: 10px 16px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      border-radius: var(--radius-full);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      text-decoration: none;
      white-space: nowrap;
      transition: var(--transition-fast);
      cursor: pointer;
      border: none;
      background: none;
    }
    .section-nav-pill:hover {
      background: var(--bg-secondary);
      color: var(--text-primary);
    }
    .section-nav-pill.active {
      background: var(--primary);
      color: white;
    }

    /* =============================================================================
       ELECTION TABS
       ============================================================================= */

    .election-tab-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .election-tab-bar::-webkit-scrollbar { display: none; }
    .election-tab {
      padding: 10px 16px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition-fast);
    }
    .election-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .election-tab.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    /* =============================================================================
       CHART LAYOUT
       ============================================================================= */

    .chart-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .chart-canvas-wrap {
      width: 200px;
      flex-shrink: 0;
    }
    .chart-canvas-wrap canvas { max-width: 100%; }
    .chart-stats-wrap {
      flex: 1;
      min-width: 0;
    }

    /* =============================================================================
       COLLAPSIBLE CENSUS SECTIONS
       ============================================================================= */

    .census-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      border-radius: 0;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: inherit;
      font: inherit;
      text-align: left;
    }
    .census-toggle-btn .toggle-chevron {
      font-size: 10px;
      transition: transform 0.2s;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .census-toggle-btn[aria-expanded="false"] .toggle-chevron {
      transform: rotate(-90deg);
    }
    .census-collapsible {
      overflow: hidden;
      max-height: 2000px;
      transition: max-height 0.3s ease;
    }
    .census-collapsible.collapsed {
      max-height: 0;
    }

    /* =============================================================================
       SECTION ACCENTS & BADGES
       ============================================================================= */

    .report-section[data-accent="party"] { border-left: 3px solid var(--rep-color); }
    .report-section[data-accent="demographics"] { border-left: 3px solid #1f77b4; }
    .report-section[data-accent="districts"] { border-left: 3px solid var(--primary); }
    .report-section[data-accent="census"] { border-left: 3px solid #4CAF50; }
    .report-section[data-accent="elections"] { border-left: 3px solid #FF9800; }
    .report-section[data-accent="intelligence"] { border-left: 3px solid #9C27B0; }

    .strategic-intel-content { font-size: 13.5px; line-height: 1.7; color: var(--text-primary); }
    .strategic-intel-content p { margin: 0 0 14px 0; }
    .strategic-intel-content p:last-child { margin-bottom: 0; }
    .strategic-intel-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(156,39,176,0.10); color: #9C27B0;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      padding: 3px 10px; border-radius: 12px; margin-bottom: 12px;
    }
    [data-theme="dark"] .strategic-intel-badge { background: rgba(156,39,176,0.20); color: #CE93D8; }

    .win-streak-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-secondary);
    }
    .trend-arrow-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
    }
    .trend-arrow-badge.dem { background: rgba(0, 174, 243, 0.12); color: #0088CC; }
    .trend-arrow-badge.rep { background: rgba(232, 27, 35, 0.12); color: #E81B23; }
    .trend-arrow-badge.stable { background: var(--bg-secondary); color: var(--text-muted); }

    /* =============================================================================
       OVERRIDES FOR POLISH
       ============================================================================= */

    .mini-map-container { height: 360px; }
    .report-section { margin-bottom: 12px; }
    .report-section-title { font-weight: 700; }

    /* =============================================================================
       PVI BADGE
       ============================================================================= */

    .pvi-badge {
      font-size: 14px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: var(--radius-full);
      letter-spacing: 0.3px;
    }
    .pvi-badge.pvi-rep {
      background: rgba(232, 27, 35, 0.12);
      color: #E81B23;
    }
    .pvi-badge.pvi-dem {
      background: rgba(0, 174, 243, 0.12);
      color: #0088CC;
    }
    .pvi-badge.pvi-even {
      background: rgba(128, 0, 128, 0.12);
      color: #800080;
    }

    /* =============================================================================
       STRATEGY BADGE
       ============================================================================= */

    .strategy-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: var(--radius-full);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .strategy-badge.mobilize {
      background: rgba(33, 150, 243, 0.12);
      color: #1565C0;
    }
    .strategy-badge.persuade {
      background: rgba(156, 39, 176, 0.12);
      color: #7B1FA2;
    }
    .strategy-badge.defend {
      background: rgba(76, 175, 80, 0.12);
      color: #2E7D32;
    }
    .strategy-badge.grow {
      background: rgba(255, 152, 0, 0.12);
      color: #E65100;
    }

    .strategy-detail {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }
    .strategy-detail-title {
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .strategy-detail-action {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }
    .strategy-detail-rationale {
      font-size: 15px;
      color: var(--text-muted);
    }

    /* =============================================================================
       MARGIN TREND (diverging bar chart)
       ============================================================================= */

    .margin-trend {
      margin-top: 16px;
    }
    .margin-trend-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .margin-trend-shift {
      font-size: 12px;
      font-weight: 500;
      padding: 3px 10px;
      border-radius: var(--radius-full);
    }
    .margin-trend-shift.dem { background: rgba(0, 174, 243, 0.12); color: #0088CC; }
    .margin-trend-shift.rep { background: rgba(232, 27, 35, 0.12); color: #E81B23; }
    .margin-trend-shift.stable { background: var(--bg-secondary); color: var(--text-muted); }
    .margin-trend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .margin-trend-label {
      width: 160px;
      flex-shrink: 0;
      font-size: 12px;
      color: var(--text-secondary);
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .margin-trend-bar-container {
      flex: 1;
      height: 24px;
      position: relative;
      background: var(--bg-secondary);
      border-radius: 4px;
      overflow: hidden;
    }
    .margin-trend-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: var(--text-muted);
      z-index: 1;
    }
    .margin-trend-bar {
      position: absolute;
      top: 2px;
      bottom: 2px;
      border-radius: 3px;
      min-width: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      color: white;
      transition: width 0.3s;
    }
    .margin-trend-bar.rep-bar {
      right: 50%;
      background: #E81B23;
    }
    .margin-trend-bar.dem-bar {
      left: 50%;
      background: #00AEF3;
    }
    .margin-trend-value {
      width: 50px;
      flex-shrink: 0;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
    }
    .margin-trend-value.dem-val { color: #0088CC; }
    .margin-trend-value.rep-val { color: #E81B23; }
    .margin-trend-axis {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--text-muted);
      padding-left: 168px;
      padding-right: 58px;
      margin-top: 4px;
    }

    /* =============================================================================
       TURNOUT GAP
       ============================================================================= */

    .turnout-gap {
      margin-top: 16px;
    }
    .turnout-gap-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .turnout-gap-card {
      background: var(--bg-secondary);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .turnout-gap-race {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .turnout-gap-stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .turnout-gap-stat {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .turnout-gap-stat strong {
      color: var(--text-primary);
    }
    .turnout-gap-highlight {
      font-size: 13px;
      font-weight: 500;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      margin-top: 4px;
    }
    .turnout-gap-highlight.flip {
      background: rgba(0, 174, 243, 0.08);
      color: #0088CC;
    }
    .turnout-gap-highlight.no-flip {
      background: var(--bg-secondary);
      color: var(--text-muted);
    }

    /* =============================================================================
       TALKING POINTS
       ============================================================================= */

    .talking-points {
      padding: 0;
    }
    .talking-points-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .talking-point {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-primary);
      line-height: 1.5;
    }
    .talking-point:last-child { border-bottom: none; }
    .talking-point-icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      background: var(--bg-secondary);
    }
    .talking-point-category {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    /* Interactive talking-points builder */
    .tpb-intro {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .tpb-audience {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .tpb-aud-btn {
      flex: 1 1 auto;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .tpb-aud-btn:hover { border-color: var(--primary); }
    .tpb-aud-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .tpb-aud-icon { font-size: 15px; }
    .tpb-blurb {
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 6px;
    }
    .tpb-points { margin-bottom: 12px; }
    .tpb-empty {
      font-size: 13px;
      color: var(--text-muted);
      padding: 10px 0;
    }
    .tpb-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .tpb-action-btn {
      min-height: 44px;
      padding: 8px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .tpb-action-btn:hover {
      border-color: var(--primary);
      background: var(--bg-tertiary, var(--bg-secondary));
    }

    /* =============================================================================
       ELECTION DRILLDOWN
       ============================================================================= */

    .drilldown-panel {
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      margin: 0;
    }
    .drilldown-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
    }
    .drilldown-table th {
      text-align: left;
      padding: 6px 8px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 1px solid var(--border);
    }
    .drilldown-table td {
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
    }
    .drilldown-table tr:last-child td { border-bottom: none; }
    .drilldown-table .dem-row td:first-child { color: #0088CC; font-weight: 600; }
    .drilldown-table .rep-row td:first-child { color: #E81B23; font-weight: 600; }
    .drilldown-bar {
      height: 6px;
      border-radius: 3px;
      background: var(--border);
      overflow: hidden;
      min-width: 60px;
    }
    .drilldown-bar-fill {
      height: 100%;
      border-radius: 3px;
    }
    .drilldown-bar-fill.dem { background: #00AEF3; }
    .drilldown-bar-fill.rep { background: #E81B23; }
    .drilldown-bar-fill.other { background: #888; }
    .history-table tr { cursor: pointer; }
    .history-table tr:hover td { background: var(--bg-secondary); }
    .drilldown-row td { padding: 0 !important; border-top: none !important; }

    /* =============================================================================
       PRECINCT COMPARISON
       ============================================================================= */

    .compare-btn {
      padding: 10px 16px;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg-primary);
      font-size: 15px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .compare-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .compare-search-wrapper {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
    }
    .compare-search-input {
      flex: 1;
      padding: 8px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--bg-primary);
      color: var(--text-primary);
      outline: none;
    }
    .compare-search-input:focus {
      border-color: var(--primary);
    }
    .compare-cancel-btn {
      padding: 10px 14px;
      min-height: 44px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .comparison-table-wrapper {
      margin-top: 16px;
      overflow-x: auto;
    }
    .comparison-full-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      font-variant-numeric: tabular-nums;
    }
    .comparison-full-table th {
      text-align: left;
      padding: 8px 12px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      border-bottom: 2px solid var(--border);
      background: var(--bg-secondary);
    }
    .comparison-full-table td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--text-primary);
    }
    .comparison-full-table .metric-label {
      font-weight: 500;
      color: var(--text-secondary);
    }
    .comparison-full-table .better { font-weight: 600; }
    .comparison-full-table .better-dem { color: #0088CC; }
    .comparison-full-table .better-rep { color: #E81B23; }

    /* =============================================================================
       SIMILAR PRECINCTS
       ============================================================================= */

    .similar-precincts { margin-top: 0; }
    .similar-precincts-title {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .similar-precincts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
    }
    .similar-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    .similar-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow-sm);
    }
    .similar-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .similar-card-code {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .similar-card-pvi {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: var(--radius-full);
    }
    .similar-card-diff {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Print overrides for new elements */
    @media print {
      .section-nav,
      .election-tab-bar { display: none !important; }
      .census-collapsible.collapsed {
        max-height: none !important;
        overflow: visible !important;
      }
      .census-toggle-btn .toggle-chevron { display: none !important; }
      canvas { max-height: 200px !important; }
      .compare-btn { display: none !important; }
      .margin-trend-bar-container { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .turnout-gap-highlight { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* Mobile overrides for new elements */
    @media (max-width: 768px) {
      .hero-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .hero-precinct-code { font-size: 24px; }
      .hero-stat-value { font-size: 20px; }
      .chart-layout { flex-direction: column; }
      .chart-canvas-wrap { width: 100%; max-width: 200px; margin: 0 auto; }
      .section-nav { padding: 0 16px; top: 53px; }
      .election-tab-bar { flex-wrap: nowrap; }
      .margin-trend-label { width: 100px; font-size: 11px; }
      .margin-trend-axis { padding-left: 108px; }
      .similar-precincts-grid { grid-template-columns: 1fr 1fr; }
      .one-pager-districts { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>
  <!-- ========================================================================
       HEADER
       ======================================================================== -->
  <header class="page-header">
    <div class="header-brand">
      <div class="header-brand-icon">TX</div>
      <span class="header-title"><span id="header-county-name">Collin County</span> <span>Precinct Lookup</span></span>
    </div>
    <div class="header-spacer"></div>
    <a href="index.html" class="header-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20 3 7"/><line x1="9" y1="4" x2="9" y2="17"/><line x1="15" y1="7" x2="15" y2="20"/></svg>Map</a>
    <a href="elections.html" class="header-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 4h16v16H4z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/></svg>Elections</a>
    <a href="forecast.html" class="header-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 17l6-6 4 4 8-8"/><polyline points="14 7 21 7 21 14"/></svg>Forecast</a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
  </header>

  <!-- ========================================================================
       SEARCH SECTION
       ======================================================================== -->
  <section class="search-section">
    <h1 class="search-heading">Look Up Your Precinct</h1>
    <p class="search-subheading">Enter a precinct number to see the full report — demographics, party data, election history, and census details.</p>

    <div class="boundary-pills">
      <button class="boundary-pill active" data-boundary="original">2024 Boundaries</button>
      <button class="boundary-pill" data-boundary="2026">2026 Boundaries</button>
    </div>

    <div class="search-wrapper">
      <input
        type="text"
        id="precinct-search"
        class="search-input"
        placeholder="Precinct number or street address"
        autocomplete="off"
      />
      <div id="search-dropdown" class="search-dropdown"></div>
    </div>
    <button id="use-location-btn" class="location-btn" type="button">📍 Use my location</button>
  </section>

  <!-- ========================================================================
       SECTION NAVIGATION (hidden until precinct selected)
       ======================================================================== -->
  <nav id="section-nav" class="section-nav hidden">
    <div class="section-nav-inner">
      <button class="section-nav-pill active" data-target="hero-section">Summary</button>
      <button class="section-nav-pill" data-target="section-party">Party</button>
      <button class="section-nav-pill" data-target="section-racial">Demographics</button>
      <button class="section-nav-pill" data-target="section-officials">Districts</button>
      <button class="section-nav-pill" data-target="section-census">Census</button>
      <button class="section-nav-pill" data-target="section-elections">Elections</button>
      <button class="section-nav-pill" data-target="section-talking-points">Talking Points</button>
      <button class="section-nav-pill" data-target="section-strategic-intel">AI Intelligence</button>
      <button class="section-nav-pill" data-target="section-similar">Similar</button>
    </div>
  </nav>

  <!-- ========================================================================
       INTRO MESSAGE (shown before search)
       ======================================================================== -->
  <div id="intro-message" class="intro-message">
    Search for a precinct above to view its full report.
  </div>

  <!-- ========================================================================
       REPORT CONTAINER (hidden until precinct selected)
       ======================================================================== -->
  <main id="report-container" class="report-container hidden">

    <!-- Hero Dashboard -->
    <div id="hero-section" data-section="hero-section"></div>

    <!-- Strategy Detail -->
    <div id="strategy-section"></div>

    <!-- Comparison Section -->
    <div id="comparison-section"></div>

    <!-- Export Buttons -->
    <div id="export-bar" class="export-bar hidden">
      <button id="export-pdf" class="export-btn">Export PDF</button>
      <button id="export-md" class="export-btn">Export Markdown</button>
      <button id="export-one-pager" class="export-btn">Field One-Pager</button>
    </div>

    <!-- Mini Map -->
    <div id="mini-map" class="mini-map-container"></div>

    <!-- Party Registration -->
    <div id="section-party" class="report-section" data-section="section-party" data-accent="party"></div>

    <!-- Racial Demographics -->
    <div id="section-racial" class="report-section" data-section="section-racial" data-accent="demographics"></div>

    <!-- Districts & Officials -->
    <div id="section-officials" class="report-section" data-section="section-officials" data-accent="districts"></div>

    <!-- Census Details -->
    <div id="section-census" class="report-section" data-section="section-census" data-accent="census"></div>

    <!-- Election History -->
    <div id="section-elections" class="report-section" data-section="section-elections" data-accent="elections">
      <div class="report-section-title">Election History</div>
      <div id="section-election-history"></div>
    </div>

    <!-- Talking Points -->
    <div id="section-talking-points" class="report-section" data-section="section-talking-points" data-accent="census"></div>

    <!-- Similar Precincts -->
    <div id="section-strategic-intel" class="report-section" data-section="section-strategic-intel" data-accent="intelligence"></div>
    <div id="section-similar" class="report-section" data-section="section-similar" data-accent="demographics"></div>

  </main>

  <!-- ========================================================================
       SCRIPTS
       ======================================================================== -->

  <script type="module">
    import { initPrecinctLookup } from "./js/precinctLookup.js";
    initPrecinctLookup();
  </script>
</body>
